<!-- @dsCard group="Motion" viewport="700x150" name="Hover states" subtitle="150ms colour transitions — hover me" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border:1px solid var(--border)}.n{font-size:12px;color:var(--fg)}.v{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)}</style></head><body><style>.b{width:120px;height:48px;display:grid;place-items:center;font-size:12px;color:var(--fg-muted);background:var(--surface);border:1px solid var(--border);transition:color 150ms cubic-bezier(.4,0,.2,1),background-color 150ms cubic-bezier(.4,0,.2,1)}.b:hover{background:var(--surface-hover);color:var(--fg)}.d:hover{background:var(--danger);color:#fff}</style><div class="row" style="align-items:center"><div class="b">neutral</div><div class="b d">close</div><span class="v" style="margin-left:12px">transition-colors · 150ms · cubic-bezier(0.4,0,0.2,1)<br>no scale, no shadow, no opacity changes</span></div></body></html>
