<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border:1px solid var(--border)}.n{font-size:12px;color:var(--fg)}.v{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)}</style></head><body><div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:12px"><span class="v" style="width:90px">--space-1</span><div style="height:12px;width:12px;background:var(--accent)"></div><span class="v">4px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="v" style="width:90px">--space-2</span><div style="height:12px;width:24px;background:var(--accent)"></div><span class="v">8px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="v" style="width:90px">--space-4</span><div style="height:12px;width:48px;background:var(--accent)"></div><span class="v">16px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="v" style="width:90px">--space-6</span><div style="height:12px;width:72px;background:var(--accent)"></div><span class="v">24px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="v" style="width:90px">--space-12</span><div style="height:12px;width:144px;background:var(--accent)"></div><span class="v">48px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="v" style="width:90px">--space-20</span><div style="height:12px;width:240px;background:var(--accent)"></div><span class="v">80px</span></div></div></body></html>
