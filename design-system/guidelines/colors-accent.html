<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border:1px solid var(--border)}.n{font-size:12px;color:var(--fg)}.v{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="n">--accent</div><div class="v">#c9a26b · brand accent</div></div><div class="sw"><div class="chip" style="background:var(--danger)"></div><div class="n">--danger</div><div class="v">#c42b1c · close hover</div></div><div class="sw"><div class="chip" style="background:var(--on-danger)"></div><div class="n">--on-danger</div><div class="v">#ffffff · on danger</div></div></div></body></html>
