<!-- @dsCard group="Motion" viewport="700x190" name="Easing & duration" subtitle="Hover a lane to play" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border:1px solid var(--border);border-radius:10px}.n{font-size:12px;color:var(--fg)}.v{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)}</style></head><body><style>.lane{position:relative;height:28px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px}.lane i{position:absolute;top:5px;left:6px;width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent-glow)}.lane:hover i{left:calc(100% - 22px)}.lane span{position:absolute;right:10px;top:6px;font:11px var(--font-mono);color:var(--fg-muted)}</style>
<div class="lane"><i style="transition:left 360ms var(--ease-out)"></i><span>--ease-out · 360ms</span></div>
<div class="lane"><i style="transition:left 600ms var(--ease-out-expo)"></i><span>--ease-out-expo · 600ms (indicators, dialogs)</span></div>
<div class="lane"><i style="transition:left 600ms var(--ease-in-out)"></i><span>--ease-in-out · loops</span></div>
<div class="lane"><i style="transition:left 700ms var(--ease-spring)"></i><span>--ease-spring · knobs, thumbs</span></div></body></html>
