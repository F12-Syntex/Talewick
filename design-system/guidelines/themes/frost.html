<!-- @dsCard group="Themes" viewport="700x230" name="Frost" subtitle="Moonlit ice + aurora teal" -->
<!DOCTYPE html><html data-theme="frost"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"></head>
<body style="padding:18px;box-sizing:border-box;font-family:var(--font-sans)">
<div style="display:flex;gap:8px"><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:34px;border-radius:8px;background:var(--background);border:1px solid var(--border-strong)"></div><span style="font:10px var(--font-mono);color:var(--fg-muted)">background</span></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:34px;border-radius:8px;background:var(--surface);border:1px solid var(--border-strong)"></div><span style="font:10px var(--font-mono);color:var(--fg-muted)">surface</span></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:34px;border-radius:8px;background:var(--surface-hover);border:1px solid var(--border-strong)"></div><span style="font:10px var(--font-mono);color:var(--fg-muted)">surface-hover</span></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:34px;border-radius:8px;background:var(--border-strong);border:1px solid var(--border-strong)"></div><span style="font:10px var(--font-mono);color:var(--fg-muted)">border-strong</span></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:34px;border-radius:8px;background:var(--fg-muted);border:1px solid var(--border-strong)"></div><span style="font:10px var(--font-mono);color:var(--fg-muted)">fg-muted</span></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:34px;border-radius:8px;background:var(--fg);border:1px solid var(--border-strong)"></div><span style="font:10px var(--font-mono);color:var(--fg-muted)">fg</span></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:34px;border-radius:8px;background:var(--accent);border:1px solid var(--border-strong)"></div><span style="font:10px var(--font-mono);color:var(--fg-muted)">accent</span></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:34px;border-radius:8px;background:var(--accent-2);border:1px solid var(--border-strong)"></div><span style="font:10px var(--font-mono);color:var(--fg-muted)">accent-2</span></div></div>
<div style="display:flex;align-items:center;gap:14px;margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--border)">
<span style="font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:.06em;color:var(--fg);text-shadow:0 0 18px var(--accent-glow)">Frost</span>
<span style="flex:1;display:flex;align-items:center;gap:6px"><span style="flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--ornament))"></span><span style="width:6px;height:6px;transform:rotate(45deg);background:var(--accent);box-shadow:0 0 8px var(--accent)"></span><span style="flex:1;height:1px;background:linear-gradient(270deg,transparent,var(--ornament))"></span></span>
<span style="display:inline-flex;align-items:flex-end;gap:2px;height:16px"><span style="width:4px;height:3.2px;border-radius:1.5px;background:var(--heat-1);box-shadow:0 0 6px var(--heat-1)"></span><span style="width:4px;height:6.4px;border-radius:1.5px;background:var(--heat-2);box-shadow:0 0 6px var(--heat-2)"></span><span style="width:4px;height:9.600000000000001px;border-radius:1.5px;background:var(--heat-3);box-shadow:0 0 6px var(--heat-3)"></span><span style="width:4px;height:12.8px;border-radius:1.5px;background:var(--heat-4);box-shadow:0 0 6px var(--heat-4)"></span><span style="width:4px;height:16px;border-radius:1.5px;background:var(--heat-5);box-shadow:0 0 6px var(--heat-5)"></span></span>
<span style="display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:9px;font-size:12px;font-weight:500;color:var(--on-accent);background:linear-gradient(180deg,var(--accent-hi),var(--accent) 55%,var(--accent-lo));box-shadow:0 8px 22px -8px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.3)">Resume</span>
<span style="display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:9px;font-size:12px;color:var(--fg);background:var(--surface-raised);border:1px solid var(--border)">Wiki</span>
</div></body></html>
