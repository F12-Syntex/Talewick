<!-- @dsCard group="Spacing" viewport="700x170" name="Shadows & glow" subtitle="sm · md · lg · xl · glow · focus ring" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border:1px solid var(--border);border-radius:10px}.n{font-size:12px;color:var(--fg)}.v{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)}</style></head><body><div class="row" style="padding:10px 4px"><div class="sw"><div style="height:72px;background:var(--surface-raised);border-radius:12px;box-shadow:var(--shadow-sm)"></div><div class="v">--shadow-sm</div></div><div class="sw"><div style="height:72px;background:var(--surface-raised);border-radius:12px;box-shadow:var(--shadow-md)"></div><div class="v">--shadow-md</div></div><div class="sw"><div style="height:72px;background:var(--surface-raised);border-radius:12px;box-shadow:var(--shadow-lg)"></div><div class="v">--shadow-lg</div></div><div class="sw"><div style="height:72px;background:var(--surface-raised);border-radius:12px;box-shadow:var(--shadow-xl)"></div><div class="v">--shadow-xl</div></div><div class="sw"><div style="height:72px;background:var(--surface-raised);border-radius:12px;box-shadow:var(--shadow-glow),inset 0 0 0 1px var(--accent)"></div><div class="v">--shadow-glow</div></div><div class="sw"><div style="height:72px;background:var(--surface-raised);border-radius:12px;border:1px solid var(--accent);box-shadow:var(--ring-focus)"></div><div class="v">--ring-focus</div></div></div></body></html>
