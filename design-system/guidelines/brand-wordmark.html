<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border:1px solid var(--border)}.n{font-size:12px;color:var(--fg)}.v{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;height:160px">
<div style="background:var(--background);border:1px solid var(--border);display:grid;place-items:center"><span style="font-size:14px;letter-spacing:0.3em;text-transform:uppercase;color:var(--text-faint)">Talewick</span></div>
<div style="background:var(--surface);border:1px solid var(--border);display:grid;place-items:center"><span style="font-size:12px;font-weight:500;letter-spacing:0.025em;color:var(--fg-muted)">Talewick</span></div></div></body></html>
