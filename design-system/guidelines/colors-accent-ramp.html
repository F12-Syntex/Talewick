<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border:1px solid var(--border);border-radius:10px}.n{font-size:12px;color:var(--fg)}.v{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--accent-hi)"></div><div class="n">--accent-hi</div><div class="v">#e3bf8a</div></div><div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="n">--accent</div><div class="v">#c9a26b</div></div><div class="sw"><div class="chip" style="background:var(--accent-lo)"></div><div class="n">--accent-lo</div><div class="v">#9a7746</div></div><div class="sw"><div class="chip" style="background:var(--accent-glow)"></div><div class="n">--accent-glow</div><div class="v">rgba .38</div></div><div class="sw"><div class="chip" style="background:var(--on-accent)"></div><div class="n">--on-accent</div><div class="v">#1a1206</div></div><div class="sw"><div class="chip" style="background:var(--success)"></div><div class="n">--success</div><div class="v">#4fd1a1</div></div></div></body></html>
