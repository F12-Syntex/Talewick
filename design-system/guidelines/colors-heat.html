<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border:1px solid var(--border);border-radius:10px}.n{font-size:12px;color:var(--fg)}.v{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)}</style></head><body><div style="height:14px;border-radius:999px;background:linear-gradient(90deg,var(--heat-1),var(--heat-2),var(--heat-3),var(--heat-4),var(--heat-5));box-shadow:0 0 24px -6px var(--heat-4);margin-bottom:14px"></div><div class="row"><div class="sw"><div class="chip" style="background:var(--heat-1)"></div><div class="n">--heat-1</div><div class="v">#7d93b2 · Calm</div></div><div class="sw"><div class="chip" style="background:var(--heat-2)"></div><div class="n">--heat-2</div><div class="v">#c9a26b · Simmer</div></div><div class="sw"><div class="chip" style="background:var(--heat-3)"></div><div class="n">--heat-3</div><div class="v">#ec8a3c · Heated</div></div><div class="sw"><div class="chip" style="background:var(--heat-4)"></div><div class="n">--heat-4</div><div class="v">#f4552e · Intense</div></div><div class="sw"><div class="chip" style="background:var(--heat-5)"></div><div class="n">--heat-5</div><div class="v">#ff2d6f · Wild</div></div></div></body></html>
