<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;box-sizing:border-box;font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border:1px solid var(--border)}.n{font-size:12px;color:var(--fg)}.v{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)}</style></head><body><div style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:baseline;gap:16px"><span style="color:var(--fg);font-size:16px;width:260px">Primary text</span><span class="v">--fg #ececf1</span></div>
<div style="display:flex;align-items:baseline;gap:16px"><span style="color:var(--fg-muted);font-size:16px;width:260px">Muted text, chrome labels</span><span class="v">--fg-muted #8b8b98</span></div>
<div style="display:flex;align-items:baseline;gap:16px"><span style="color:var(--text-faint);font-size:16px;width:260px">Faint watermark</span><span class="v">--fg-muted / 40%</span></div></div></body></html>
