<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:16px;box-sizing:border-box}.l{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-subtle);margin:0 0 6px}.f{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { TitleBar, WindowControls, IconButton, Icon } = window.TalewickDesignSystem_fc8a08;
function Demo(){
  const [max,setMax]=React.useState(false);
  const [p,setP]=React.useState(.42);
  React.useEffect(()=>{const i=setInterval(()=>setP(x=>x>=.95?.1:x+.08),1200);return()=>clearInterval(i)},[]);
  const actions=<><IconButton size="sm" label="Buddy" icon={<Icon name="sparkles" size={14}/>}/><IconButton size="sm" label="Bookmarks" icon={<Icon name="bookmark" size={14}/>}/></>;
  return (<div>
    <p className="l">Arcane · win32 · with progress</p>
    <div className="f"><TitleBar variant="arcane" context="The Ashen Lantern · Ch. 213" search="Search books, chapters, wiki" actions={actions} progress={p} maximized={max} onToggleMaximize={()=>setMax(m=>!m)}/></div>
    <p className="l">Arcane · darwin</p>
    <div className="f"><TitleBar variant="arcane" platform="darwin" context="Library" search="Search books, chapters, wiki"/></div>
    <p className="l">Classic (repo v0.2.3)</p>
    <div className="f"><TitleBar platform="win32"/></div>
    <p className="l">WindowControls · pill / classic, restore state</p>
    <div style={{display:"flex",gap:12}}>
      <div className="f" style={{display:"inline-flex",height:36,background:"var(--surface)"}}><WindowControls variant="pill" maximized/></div>
      <div className="f" style={{display:"inline-flex",height:36,background:"var(--surface)"}}><WindowControls maximized/></div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
