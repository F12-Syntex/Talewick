<!DOCTYPE html><html><head><meta charset="utf-8"><title>Talewick — Desktop</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body,#root{height:100%;margin:0;overflow:hidden}.ctl{position:fixed;right:12px;bottom:12px;display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--border);font:12px var(--font-mono);z-index:5}.ctl button{background:none;border:0;color:var(--fg-muted);font:inherit;padding:4px 8px;cursor:pointer}.ctl button[data-on="1"]{background:var(--surface-hover);color:var(--fg)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="Window.jsx"></script>
<script type="text/babel">
function App(){
  const [platform,setPlatform]=React.useState(localStorage.getItem("tw-kit-platform")||"win32");
  const [maximized,setMaximized]=React.useState(false);
  const [state,setState]=React.useState("open");
  React.useEffect(()=>localStorage.setItem("tw-kit-platform",platform),[platform]);
  const win = state==="open" && (
    <div style={{height:"100%",background:"var(--background)"}}>
      <TalewickWindow platform={platform} maximized={maximized} setMaximized={setMaximized} onMinimize={()=>setState("minimized")} onClose={()=>setState("closed")} />
    </div>);
  return (<>
    {win}
    {state!=="open" && <div style={{height:"100%",display:"grid",placeItems:"center",background:"#000",color:"var(--fg-muted)",fontSize:12}}>
      <button onClick={()=>setState("open")} style={{background:"var(--surface)",color:"var(--fg)",border:"1px solid var(--border)",padding:"8px 14px",font:"inherit",cursor:"pointer"}}>Window {state} — reopen</button></div>}
    <div className="ctl">{["win32","linux","darwin"].map(p=><button key={p} data-on={platform===p?"1":"0"} onClick={()=>setPlatform(p)}>{p}</button>)}</div>
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
